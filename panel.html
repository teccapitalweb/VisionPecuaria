<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Visión Pecuaria — Panel Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<style>
:root {
  --bg-deep: #060e0a;
  --bg-base: #0a1f12;
  --bg-card: #0f2818;
  --bg-card-hover: #143020;
  --bg-elevated: #1a3925;
  --border: rgba(255,255,255,.08);
  --border-hover: rgba(212,160,23,.25);
  --field-700: #1a5d3a;
  --field-800: #0f3d27;
  --gold: #d4a017;
  --gold-light: #e8c465;
  --gold-soft: rgba(212,160,23,.12);
  --leather: #6b4423;
  --text: #fff;
  --text-soft: rgba(255,255,255,.7);
  --text-mute: rgba(255,255,255,.45);
  --success: #22c55e;
  --error: #ef4444;
  --warn: #f59e0b;
  --info: #3b82f6;
  --r-sm: 8px; --r: 12px; --r-md: 16px; --r-lg: 22px; --r-xl: 28px;
  --sb-w: 264px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Plus Jakarta Sans', -apple-system, system-ui, sans-serif;
  background: var(--bg-deep);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  overflow-x: hidden;
  min-height: 100vh;
}
button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; outline: none; }

/* ═══════════ FONDO AMBIENTE ═══════════ */
.ambient { position: fixed; inset: 0; z-index: -2; overflow: hidden; pointer-events: none; }
.ambient-orb {
  position: absolute; border-radius: 50%;
  filter: blur(120px); opacity: .15;
}
.ambient-orb--1 { width: 600px; height: 600px; background: var(--field-700); top: -200px; left: -100px; }
.ambient-orb--2 { width: 500px; height: 500px; background: var(--gold); bottom: -150px; right: -100px; opacity: .08; }
.ambient-grid {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    linear-gradient(rgba(212,160,23,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212,160,23,.025) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
}

/* ═══════════ LAYOUT ═══════════ */
.app { display: flex; min-height: 100vh; }

/* ═══════════ SIDEBAR ═══════════ */
.sidebar {
  width: var(--sb-w);
  background: rgba(10,31,18,.85);
  backdrop-filter: blur(20px);
  border-right: 1px solid var(--border);
  position: fixed; top: 0; bottom: 0; left: 0;
  display: flex; flex-direction: column;
  z-index: 100;
  overflow-y: auto;
  transition: transform .3s ease;
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: rgba(212,160,23,.3); }

.sb-brand {
  padding: 22px 18px 16px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--border);
}
.sb-brand-logo {
  width: 42px; height: 42px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--field-700), var(--field-800));
  border: 1.5px solid rgba(212,160,23,.4);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  box-shadow: 0 6px 18px rgba(15,61,39,.5);
}
.sb-brand-text h1 {
  font: 800 1rem/1.1 'Plus Jakarta Sans', sans-serif;
  letter-spacing: -.3px;
}
.sb-brand-text p {
  font-size: .68rem; font-weight: 700;
  color: var(--gold-light);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-top: 2px;
}

/* Search global en sidebar */
.sb-search {
  padding: 14px 14px 8px;
  position: relative;
}
.sb-search-input {
  width: 100%;
  padding: 9px 12px 9px 36px;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  color: #fff;
  font-size: .82rem;
  transition: border-color .2s, background .2s;
}
.sb-search-input:focus { border-color: var(--gold); background: rgba(255,255,255,.07); }
.sb-search-input::placeholder { color: var(--text-mute); }
.sb-search-icon {
  position: absolute; left: 26px; top: 50%; transform: translateY(-50%);
  color: var(--text-mute); pointer-events: none;
}
.sb-search-kbd {
  position: absolute; right: 22px; top: 50%; transform: translateY(-50%);
  font: 600 .65rem 'JetBrains Mono', monospace;
  background: rgba(255,255,255,.06);
  padding: 2px 5px;
  border-radius: 4px;
  color: var(--text-mute);
  pointer-events: none;
}

.sb-section-label {
  font-size: .65rem;
  font-weight: 700;
  color: var(--text-mute);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 14px 22px 6px;
}

.sb-nav { padding: 0 10px; flex: 1; }
.sb-nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 12px;
  border-radius: var(--r-sm);
  color: var(--text-soft);
  background: transparent; border: none;
  font: 500 .87rem 'Plus Jakarta Sans', sans-serif;
  width: 100%; text-align: left;
  transition: background .2s, color .2s;
  position: relative;
  margin-bottom: 1px;
}
.sb-nav-item:hover { background: rgba(255,255,255,.04); color: #fff; }
.sb-nav-item.active {
  background: linear-gradient(90deg, rgba(212,160,23,.12), rgba(212,160,23,.02));
  color: var(--gold-light);
  font-weight: 700;
}
.sb-nav-item.active::before {
  content: ''; position: absolute; left: 0; top: 20%; bottom: 20%;
  width: 3px; border-radius: 0 3px 3px 0;
  background: var(--gold);
}
.sb-nav-icon { font-size: 17px; flex-shrink: 0; width: 22px; text-align: center; }
.sb-nav-label { flex: 1; }
.sb-nav-badge {
  font: 700 .65rem 'JetBrains Mono', monospace;
  background: var(--gold);
  color: var(--bg-deep);
  padding: 1px 7px;
  border-radius: 100px;
  min-width: 22px;
  text-align: center;
}
.sb-nav-badge--alert {
  background: var(--error);
  color: #fff;
  animation: pulseAlert 2s ease-in-out infinite;
}
@keyframes pulseAlert {
  0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,.5); }
  50% { box-shadow: 0 0 0 5px rgba(239,68,68,0); }
}

.sb-foot {
  padding: 12px 14px 16px;
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 4px;
}
.sb-user-card {
  display: flex; align-items: center; gap: 10px;
  padding: 10px;
  border-radius: var(--r-sm);
  background: rgba(255,255,255,.03);
  border: 1px solid var(--border);
  margin-bottom: 8px;
}
.sb-user-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  color: var(--bg-deep);
  font-weight: 800; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.sb-user-info { flex: 1; min-width: 0; }
.sb-user-info strong {
  display: block;
  font-size: .82rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sb-user-info small {
  font-size: .68rem;
  color: var(--text-mute);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: block;
}
.sb-foot-btn {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 11px;
  border: none; background: transparent;
  color: var(--text-soft);
  font: 500 .8rem 'Plus Jakarta Sans', sans-serif;
  border-radius: var(--r-sm);
  width: 100%; text-align: left;
  transition: background .2s, color .2s;
}
.sb-foot-btn:hover { background: rgba(255,255,255,.04); color: #fff; }
.sb-foot-btn--exit:hover { color: #fca5a5; background: rgba(239,68,68,.08); }

/* ═══════════ MAIN ═══════════ */
.main {
  flex: 1;
  margin-left: var(--sb-w);
  min-width: 0;
  display: flex; flex-direction: column;
}

.topbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(6,14,10,.85);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 14px 28px;
  display: flex; align-items: center; gap: 14px;
}
.menu-toggle {
  display: none;
  width: 38px; height: 38px;
  background: rgba(255,255,255,.05);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  color: #fff;
  align-items: center; justify-content: center;
}
.topbar-breadcrumb {
  flex: 1; min-width: 0;
}
.topbar-breadcrumb h2 {
  font: 800 1.05rem/1.2 'Plus Jakarta Sans', sans-serif;
  letter-spacing: -.3px;
  display: flex; align-items: center; gap: 8px;
}
.topbar-breadcrumb p {
  font-size: .8rem;
  color: var(--text-mute);
  margin-top: 2px;
}
.topbar-actions { display: flex; gap: 8px; align-items: center; }
.topbar-btn {
  height: 38px;
  padding: 0 14px;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  color: var(--text-soft);
  font: 600 .83rem 'Plus Jakarta Sans', sans-serif;
  display: inline-flex; align-items: center; gap: 7px;
  transition: all .2s;
}
.topbar-btn:hover {
  background: rgba(212,160,23,.08);
  border-color: var(--border-hover);
  color: var(--gold-light);
}
.topbar-btn--primary {
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  color: var(--bg-deep);
  border-color: var(--gold);
  font-weight: 700;
}
.topbar-btn--primary:hover {
  background: linear-gradient(135deg, var(--gold-light), #f5d77a);
  color: var(--bg-deep);
  transform: translateY(-1px);
  box-shadow: 0 8px 18px rgba(212,160,23,.3);
}
.topbar-btn-icon {
  width: 38px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  position: relative;
}
.topbar-btn-icon .badge {
  position: absolute; top: 6px; right: 6px;
  width: 8px; height: 8px;
  background: var(--gold);
  border: 2px solid var(--bg-deep);
  border-radius: 50%;
}

.content { padding: 28px; flex: 1; }

/* ═══════════ PAGINAS (sólo una visible a la vez) ═══════════ */
.page { display: none; animation: pageIn .35s cubic-bezier(.2,.8,.3,1); }
.page.active { display: block; }
@keyframes pageIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ═══════════ DASHBOARD KPIs ═══════════ */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.kpi {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 20px;
  position: relative;
  overflow: hidden;
  transition: border-color .2s, transform .2s;
}
.kpi:hover {
  border-color: var(--border-hover);
  transform: translateY(-2px);
}
.kpi::after {
  content: ''; position: absolute; top: 0; right: 0;
  width: 120px; height: 120px;
  background: radial-gradient(circle, var(--kpi-glow, rgba(212,160,23,.15)), transparent 65%);
  pointer-events: none;
}
.kpi-head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px;
}
.kpi-icon {
  width: 38px; height: 38px;
  border-radius: var(--r-sm);
  background: var(--kpi-bg, rgba(212,160,23,.1));
  border: 1px solid var(--kpi-border, rgba(212,160,23,.25));
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.kpi-label {
  font-size: .78rem;
  color: var(--text-soft);
  font-weight: 600;
  flex: 1;
}
.kpi-trend {
  font: 700 .72rem 'JetBrains Mono', monospace;
  padding: 2px 7px;
  border-radius: 100px;
  display: inline-flex; align-items: center; gap: 3px;
}
.kpi-trend--up { background: rgba(34,197,94,.12); color: #4ade80; }
.kpi-trend--down { background: rgba(239,68,68,.12); color: #f87171; }
.kpi-trend--neutral { background: rgba(255,255,255,.05); color: var(--text-mute); }
.kpi-value {
  font: 800 1.9rem/1 'Plus Jakarta Sans', sans-serif;
  letter-spacing: -.5px;
  margin-bottom: 4px;
}
.kpi-detail {
  font-size: .75rem;
  color: var(--text-mute);
}

/* KPIs colorvariants */
.kpi--miembros { --kpi-bg: rgba(34,197,94,.12); --kpi-border: rgba(34,197,94,.3); --kpi-glow: rgba(34,197,94,.15); }
.kpi--pendientes { --kpi-bg: rgba(245,158,11,.12); --kpi-border: rgba(245,158,11,.3); --kpi-glow: rgba(245,158,11,.15); }
.kpi--cursos { --kpi-bg: rgba(59,130,246,.12); --kpi-border: rgba(59,130,246,.3); --kpi-glow: rgba(59,130,246,.15); }
.kpi--ingresos { --kpi-bg: rgba(212,160,23,.15); --kpi-border: rgba(212,160,23,.4); --kpi-glow: rgba(212,160,23,.2); }

/* ═══════════ DASHBOARD CHARTS / BLOCKS ═══════════ */
.dash-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 18px;
  margin-bottom: 24px;
}
@media (max-width: 1100px) { .dash-grid { grid-template-columns: 1fr; } }

.block {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 22px;
}
.block-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px;
}
.block-head h3 {
  font: 800 1.02rem 'Plus Jakarta Sans', sans-serif;
  display: flex; align-items: center; gap: 8px;
}
.block-head-actions {
  display: flex; gap: 6px;
}
.tab-pill {
  padding: 5px 12px;
  background: rgba(255,255,255,.05);
  border: 1px solid var(--border);
  border-radius: 100px;
  color: var(--text-mute);
  font-size: .76rem;
  font-weight: 600;
}
.tab-pill.active {
  background: var(--gold-soft);
  border-color: rgba(212,160,23,.4);
  color: var(--gold-light);
}

/* Mini chart bars (CSS only) */
.bar-chart {
  display: flex; align-items: flex-end; gap: 8px;
  height: 180px;
  padding: 12px 0;
  margin-bottom: 12px;
}
.bar-col {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; gap: 6px;
}
.bar {
  width: 100%;
  max-width: 32px;
  background: linear-gradient(180deg, var(--gold), var(--gold-light));
  border-radius: 6px 6px 0 0;
  position: relative;
  transition: height 1s cubic-bezier(.2,.8,.3,1);
  min-height: 4px;
}
.bar:hover { background: linear-gradient(180deg, var(--gold-light), var(--gold)); }
.bar-label {
  font-size: .7rem;
  color: var(--text-mute);
  font-weight: 600;
}

/* Activity feed */
.activity-list {
  display: flex; flex-direction: column;
}
.activity-item {
  display: flex; gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.activity-item:last-child { border-bottom: none; }
.activity-icon {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--bg-elevated);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
}
.activity-icon--success { background: rgba(34,197,94,.15); }
.activity-icon--info { background: rgba(59,130,246,.15); }
.activity-icon--warn { background: rgba(245,158,11,.15); }
.activity-icon--gold { background: rgba(212,160,23,.15); }
.activity-content { flex: 1; min-width: 0; }
.activity-text {
  font-size: .85rem;
  color: var(--text);
  margin-bottom: 2px;
}
.activity-text strong { color: var(--gold-light); }
.activity-time {
  font-size: .7rem;
  color: var(--text-mute);
}

/* Pendientes / Quick actions */
.qa-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
}
.qa-card {
  padding: 16px;
  background: rgba(255,255,255,.03);
  border: 1px solid var(--border);
  border-radius: var(--r);
  transition: all .2s;
  text-align: left;
}
.qa-card:hover {
  background: var(--gold-soft);
  border-color: var(--border-hover);
  transform: translateY(-2px);
}
.qa-card-icon {
  width: 36px; height: 36px;
  border-radius: var(--r-sm);
  background: rgba(212,160,23,.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  margin-bottom: 10px;
}
.qa-card-title {
  font: 700 .9rem 'Plus Jakarta Sans', sans-serif;
  margin-bottom: 4px;
}
.qa-card-desc {
  font-size: .78rem;
  color: var(--text-mute);
}

/* ═══════════ TABLA / DATA TABLE ═══════════ */
.data-table-wrap {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  overflow: hidden;
}
.data-table-toolbar {
  padding: 16px 20px;
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
}
.data-table-search {
  flex: 1; min-width: 200px;
  position: relative;
}
.data-table-search input {
  width: 100%;
  height: 38px;
  padding: 0 12px 0 38px;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  color: #fff;
  font-size: .85rem;
}
.data-table-search input:focus { border-color: var(--gold); }
.data-table-search input::placeholder { color: var(--text-mute); }
.data-table-search-icon {
  position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
  color: var(--text-mute);
}
.filter-chip {
  height: 38px;
  padding: 0 14px;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  color: var(--text-soft);
  font-size: .82rem; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px;
  transition: all .2s;
}
.filter-chip:hover { background: var(--gold-soft); color: var(--gold-light); }
.filter-chip.active { background: var(--gold-soft); border-color: rgba(212,160,23,.4); color: var(--gold-light); }

.data-table {
  width: 100%;
  border-collapse: collapse;
}
.data-table th {
  font: 700 .7rem 'Plus Jakarta Sans', sans-serif;
  color: var(--text-mute);
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 14px 20px;
  text-align: left;
  background: rgba(255,255,255,.02);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.data-table td {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  font-size: .87rem;
  vertical-align: middle;
}
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: rgba(255,255,255,.02); }

.member-cell {
  display: flex; align-items: center; gap: 12px;
}
.member-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--field-700), var(--field-800));
  border: 1.5px solid rgba(212,160,23,.3);
  color: var(--gold-light);
  font: 800 12px 'Plus Jakarta Sans', sans-serif;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.member-name { font-weight: 700; color: #fff; }
.member-email { font-size: .74rem; color: var(--text-mute); margin-top: 1px; }

.status {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px;
  border-radius: 100px;
  font: 700 .7rem 'Plus Jakarta Sans', sans-serif;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.status--active { background: rgba(34,197,94,.12); color: #4ade80; border: 1px solid rgba(34,197,94,.3); }
.status--pending { background: rgba(245,158,11,.12); color: #fbbf24; border: 1px solid rgba(245,158,11,.3); }
.status--expired { background: rgba(239,68,68,.12); color: #f87171; border: 1px solid rgba(239,68,68,.3); }
.status--inactive { background: rgba(255,255,255,.05); color: var(--text-mute); border: 1px solid var(--border); }
.status--free { background: rgba(59,130,246,.12); color: #60a5fa; border: 1px solid rgba(59,130,246,.3); }

.action-btn {
  padding: 6px 12px;
  border-radius: var(--r-sm);
  font: 600 .76rem 'Plus Jakarta Sans', sans-serif;
  border: none;
  margin-right: 5px;
  transition: all .15s;
}

/* ═══════════ MODAL ═══════════ */
.modal-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,.7);
  backdrop-filter: blur(8px);
  align-items: center; justify-content: center;
  padding: 20px;
  animation: fadeIn .2s ease;

}
.modal-overlay.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {

@media (max-width: 640px) {

  .modal-body { padding: 18px; }

}
@keyframes modalIn {

.modal-head {

.modal-close:hover { background: rgba(239,68,68,.15); color: #f87171; transform: rotate(90deg); }
.modal-body { padding: 22px 24px; }

<script>
// ═══════════════════════════════════════════════════════════
// FIREBASE INIT
// ═══════════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyDQXkIo-BWPIeLZzHeTMN986WMDn0TrTJU",
  authDomain: "visionpecuaria-vip.firebaseapp.com",
  projectId: "visionpecuaria-vip",
  storageBucket: "visionpecuaria-vip.firebasestorage.app",
  messagingSenderId: "978318807782",
  appId: "1:978318807782:web:626e67bb30795c15b02127"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ═══════════════════════════════════════════════════════════
// STATE GLOBAL
// ═══════════════════════════════════════════════════════════
const STATE = {
  miembros: [],          // Pagados (VIP)
  usuariosFree: [],      // Solo registrados sin pagar
  pagosPendientes: [],
  cursos: [],
  videos: [],
  pdfs: [],
  webinars: [],
  notificaciones: [],
  pagos: [],
  examenes: [],
  certificados: [],
  config: {},
  currentPage: 'dashboard'
};

// Combina miembros + usuarios_free en una sola lista normalizada
function todosLosUsuarios() {
  const miembros = STATE.miembros.map(m => ({ ...m, _tipo: 'miembro' }));
  const free = STATE.usuariosFree
    // Si ya existe en miembros (mismo email), no duplicar
    .filter(u => !STATE.miembros.find(m => m.email === u.email))
    .map(u => ({
      ...u,
      _tipo: 'free',
      plan: u.plan || 'Free',
      estado: 'free',
      fechaRegistro: u.fechaRegistro?.toDate ? u.fechaRegistro.toDate().toISOString() : (u.fechaRegistro || null)
    }));
  return [...miembros, ...free];
}

// ═══════════════════════════════════════════════════════════
// AUTH GUARD
// ═══════════════════════════════════════════════════════════
auth.onAuthStateChanged(function(user) {
  if (!user) { window.location.href = 'index.html'; return; }
  db.collection('admins').doc(user.uid).get().then(function(snap) {
    if (!snap.exists) {
      alert('No tienes permisos de administrador.');
      auth.signOut();
      window.location.href = 'index.html';
      return;
    }
    document.getElementById('userEmail').textContent = user.email;
    const nombre = (snap.data() && snap.data().nombre) || user.email.split('@')[0];
    document.getElementById('userName').textContent = nombre;
    const ini = nombre.split(' ').slice(0,2).map(s => s[0]).join('').toUpperCase();
    document.getElementById('userAvatar').textContent = ini || 'VP';
    iniciarApp();
  });
});

window.cerrarSesion = function() {
  if (confirm('¿Cerrar sesión del panel?')) {
    auth.signOut().then(function() { window.location.href = 'index.html'; });
  }
};

// ═══════════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════════
window.toast = function(msg, tipo = 'success', icon) {
  const icons = { success: '✅', error: '⚠️', info: 'ℹ️' };
  const cont = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast toast--' + tipo;
  el.innerHTML = `<span>${icon || icons[tipo] || '✅'}</span><span>${msg}</span>`;
  cont.appendChild(el);
  setTimeout(() => {
    el.style.animation = 'toastIn .3s reverse';
    setTimeout(() => el.remove(), 350);
  }, 3500);
};

// ═══════════════════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════════════════
window.abrirModal = function(html) {
  document.getElementById('modalBox').innerHTML = html;

function fmtFecha(d) {
  if (!d) return '—';
  const date = typeof d === 'string' ? new Date(d) : d;
  if (isNaN(date)) return '—';
  return date.toLocaleDateString('es-MX', { day:'numeric', month:'short', year:'numeric' });
}
function fmtFechaCorta(d) {
  if (!d) return '—';
  const date = typeof d === 'string' ? new Date(d) : d;
  if (isNaN(date)) return '—';
  return date.toLocaleDateString('es-MX', { day:'numeric', month:'short' });
}
function fmtRelative(d) {
  if (!d) return '';
  const date = typeof d === 'string' ? new Date(d) : d;
  if (isNaN(date)) return '';
  const diff = (Date.now() - date.getTime()) / 1000;
  if (diff < 60) return 'hace un momento';
  if (diff < 3600) return `hace ${Math.floor(diff/60)} min`;
  if (diff < 86400) return `hace ${Math.floor(diff/3600)} h`;
  if (diff < 604800) return `hace ${Math.floor(diff/86400)} d`;
  return date.toLocaleDateString('es-MX', { day:'numeric', month:'short' });
}
function fmtMoney(n) {
  return '$' + (n || 0).toLocaleString('es-MX');
}
function iniciales(nombre) {
  return (nombre || 'VP').split(' ').slice(0,2).map(s => s[0]||'').join('').toUpperCase();
}
function escapeHTML(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function ytId(url) {
  if (!url) return null;
  const m = String(url).match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
  return m ? m[1] : null;
}

function suscribirTodo() {
  // Helper: suscripción silenciosa que no truena si faltan permisos
  function safeSnapshot(query, handler, label) {
    return query.onSnapshot(handler, err => {
      console.warn(`⚠️ Sin permisos para "${label}":`, err.code);
    });
  }

  safeSnapshot(db.collection('miembros'), snap => {
    STATE.miembros = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    actualizarBadges();
    if (STATE.currentPage === 'dashboard') renderDashboard();
    if (STATE.currentPage === 'miembros') renderMiembros();
  }, 'miembros');

  // Usuarios FREE (registrados sin pagar - vienen del landing)
  safeSnapshot(db.collection('usuarios_free'), snap => {
    STATE.usuariosFree = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    actualizarBadges();
    if (STATE.currentPage === 'dashboard') renderDashboard();
    if (STATE.currentPage === 'miembros') renderMiembros();
  }, 'usuarios_free');

  safeSnapshot(db.collection('pagos_pendientes'), snap => {
    STATE.pagosPendientes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    actualizarBadges();
    if (STATE.currentPage === 'dashboard') renderDashboard();
    if (STATE.currentPage === 'pendientes') renderPendientes();
  }, 'pagos_pendientes');

  safeSnapshot(db.collection('cursos'), snap => {
    STATE.cursos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    actualizarBadges();
    if (STATE.currentPage === 'dashboard') renderDashboard();
    if (STATE.currentPage === 'cursos') renderCursos();
  }, 'cursos');

  safeSnapshot(db.collection('videos'), snap => {
    STATE.videos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    actualizarBadges();
    if (STATE.currentPage === 'videos') renderVideos();
  }, 'videos');

  safeSnapshot(db.collection('pdfs'), snap => {
    STATE.pdfs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    actualizarBadges();
    if (STATE.currentPage === 'pdfs') renderPdfs();
  }, 'pdfs');

  safeSnapshot(db.collection('sesiones'), snap => {
    STATE.webinars = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    actualizarBadges();
    if (STATE.currentPage === 'webinars') renderWebinars();
    if (STATE.currentPage === 'dashboard') renderDashboard();
  }, 'sesiones');

  safeSnapshot(db.collection('notificaciones').orderBy('fecha','desc').limit(50), snap => {
    STATE.notificaciones = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (STATE.currentPage === 'avisos') renderAvisos();
    if (STATE.currentPage === 'dashboard') renderDashboard();
  }, 'notificaciones');

  safeSnapshot(db.collection('pagos').orderBy('fecha','desc').limit(100), snap => {
    STATE.pagos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (STATE.currentPage === 'pagos') renderPagos();
    if (STATE.currentPage === 'dashboard') renderDashboard();
  }, 'pagos');

  safeSnapshot(db.collection('config').doc('club'), snap => {
    STATE.config = snap.exists ? snap.data() : {};
    if (STATE.currentPage === 'config') renderConfig();
  }, 'config');

  safeSnapshot(db.collection('certificados').limit(100), snap => {
    STATE.certificados = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (STATE.currentPage === 'certificados') renderCertificados();
  }, 'certificados');

  safeSnapshot(db.collection('examenes').limit(100), snap => {
    STATE.examenes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (STATE.currentPage === 'examenes') renderExamenes();
  }, 'examenes');
}

function actualizarBadges() {
  const totalUsuarios = STATE.miembros.length + STATE.usuariosFree.filter(u => !STATE.miembros.find(m => m.email === u.email)).length;
  const sets = [
    ['badgeMiembros', totalUsuarios],
    ['badgePendientes', STATE.pagosPendientes.length],
    ['badgeCursos', STATE.cursos.length],
    ['badgeVideos', STATE.videos.length],
    ['badgePdfs', STATE.pdfs.length],
    ['badgeWebinars', STATE.webinars.length]
  ];
  sets.forEach(([id, n]) => {
    const el = document.getElementById(id);
    if (!el) return;
    if (n > 0) { el.style.display = ''; el.textContent = n; }
    else el.style.display = 'none';
  });
}

        else if (plan.includes('anual')) pill = 'plan-pill--anual';
        else if (plan.includes('mensual')) pill = 'plan-pill--mensual';

        let estado, stTxt;
        if (esFree) {
          estado = 'free'; stTxt = '🆓 FREE';
        } else {
          const venceFut = m.vence && new Date(m.vence) > new Date();

          <td><span class="status status--${estado}">${stTxt}</span></td>
          ${mini ? '' : `<td>${fmtFecha(m.fechaRegistro)}</td><td>${esFree ? '—' : fmtFecha(m.vence)}</td>

    estado: 'activo',

window.confirmarConvertirVip = function(freeId) {
  const u = STATE.usuariosFree.find(x => x.id === freeId);
  if (!u) return;
  const plan = document.getElementById('cvPlan').value;
  const dias = parseInt(document.getElementById('cvDias').value, 10);
  const monto = parseInt(document.getElementById('cvMonto').value) || 0;
  const ahora = new Date().toISOString();
  const vence = new Date(); vence.setDate(vence.getDate() + dias);

  // 1. Crear doc en miembros con el mismo UID que tenía en usuarios_free
  db.collection('miembros').doc(u.uid || freeId).set({
    nombre: u.nombre || u.email.split('@')[0],
    email: u.email,
    whatsapp: u.whatsapp || '',
    plan,
    vence: vence.toISOString(),
    estado: 'activo',
    fechaRegistro: u.fechaRegistro?.toDate ? u.fechaRegistro.toDate().toISOString() : (u.fechaRegistro || ahora),
    fechaUltimaActivacion: ahora,
    cursosDesbloqueados: [],
    photoURL: u.photoURL || null,
    origen: u.origen || 'admin'
  }).then(() => {
    // 2. Registrar el pago si hay monto
    if (monto > 0) {
      db.collection('pagos').add({ email: u.email, monto, plan, fecha: ahora });
    }
    // 3. Borrar de usuarios_free
    return db.collection('usuarios_free').doc(freeId).delete();
  }).then(() => {
    cerrarModal();
    toast(`✅ ${u.email} es ahora VIP (${dias} días)`, 'success');
  }).catch(err => {
    toast('Error: ' + err.message, 'error');
  });
};

window.aprobarPago = function(id) {
  const p = STATE.pagosPendientes.find(x => x.id === id);
  if (!p) return;
  const vence = new Date(); vence.setMonth(vence.getMonth() + 1);
  const ahora = new Date().toISOString();
  // Buscar si ya existe miembro con ese email (para mantener cursosDesbloqueados)
  const existente = STATE.miembros.find(m => m.email === p.email);
  if (existente) {
    // Renovación: solo actualiza vencimiento + fechaUltimaActivacion
    db.collection('miembros').doc(existente.id).update({
      estado: 'activo',
      plan: p.plan || existente.plan || 'VIP Mensual',
      vence: vence.toISOString(),
      fechaUltimaActivacion: ahora
    }).then(() => {
      db.collection('pagos').add({ email: p.email, monto: p.monto || 200, plan: p.plan, fecha: ahora });
      db.collection('pagos_pendientes').doc(id).delete();
      toast('✓ Renovación aprobada · Drip continúa', 'success');
    });
  } else {
    // Nuevo miembro
    db.collection('miembros').add({
      nombre: p.nombre, email: p.email, whatsapp: p.whatsapp || '',
      plan: p.plan || 'VIP Mensual',
      vence: vence.toISOString(),
      estado: 'activo',
      fechaRegistro: ahora,
      fechaUltimaActivacion: ahora,
      cursosDesbloqueados: []
    }).then(() => {
      db.collection('pagos').add({ email: p.email, monto: p.monto || 200, plan: p.plan, fecha: ahora });
      db.collection('pagos_pendientes').doc(id).delete();
      toast('✓ Pago aprobado · Nuevo miembro creado', 'success');
    });
  }
};
window.rechazarPago = function(id) {
  if (!confirm('¿Rechazar este pago?')) return;
  db.collection('pagos_pendientes').doc(id).delete().then(() => toast('Pago rechazado', 'info'));
};

// Helper: convierte URL de Google Drive a URL pública para img
function normalizarUrlImagen(url) {
  if (!url) return '';
  // Google Drive: convertir /file/d/{id}/view → /thumbnail?id={id}&sz=w1200
  const driveMatch = url.match(/drive\.google\.com\/file\/d\/([^\/\?]+)/);
  if (driveMatch) {
    return `https://drive.google.com/thumbnail?id=${driveMatch[1]}&sz=w1200`;
  }
  // Google Drive open?id= format
  const driveMatch2 = url.match(/drive\.google\.com\/open\?id=([^&]+)/);
  if (driveMatch2) {
    return `https://drive.google.com/thumbnail?id=${driveMatch2[1]}&sz=w1200`;
  }
  return url;
}

function normalizarUrlVideo(url) {
  if (!url) return '';
  // Google Drive: convertir /file/d/{id}/view → /file/d/{id}/preview (player embebido oficial)
  const driveMatch = url.match(/drive\.google\.com\/file\/d\/([^\/\?]+)/);
  if (driveMatch) {

  }

window.guardarClase = function(cursoId, idx) {
  const titulo = document.getElementById('clTitulo').value.trim();
  const urlRaw = document.getElementById('clUrl').value.trim();
  if (!titulo) { toast('Título obligatorio', 'error'); return; }
  if (!urlRaw) { toast('URL del video obligatoria', 'error'); return; }
  const clase = {
    titulo,
    url: normalizarUrlVideo(urlRaw),
    urlOriginal: urlRaw // Guardamos también el original por si hay que reprocesar
  };
  const c = STATE.cursos.find(x => x.id === cursoId);
  if (!c) return;
  const clases = (c.clases || []).slice();
  if (idx === null) clases.push(clase);
  else clases[idx] = clase;
  db.collection('cursos').doc(cursoId).update({ clases }).then(() => {
    toast(idx === null ? 'Clase agregada' : 'Clase actualizada', 'success');
    gestionarClases(cursoId);
  });
};
window.eliminarClase = function(cursoId, idx) {
  if (!confirm('¿Eliminar esta clase?')) return;
  const c = STATE.cursos.find(x => x.id === cursoId);
  if (!c) return;
  const clases = (c.clases || []).slice();
  clases.splice(idx, 1);
  db.collection('cursos').doc(cursoId).update({ clases }).then(() => {
    toast('Clase eliminada', 'success');
    gestionarClases(cursoId);
  });
};

window.guardarWebinar = function(id) {
  const fecha = document.getElementById('wFecha').value;
  const datos = {
    titulo: document.getElementById('wTitulo').value.trim(),
    instructor: document.getElementById('wInstructor').value.trim(),
    rol: document.getElementById('wRol').value.trim(),
    fecha: fecha ? new Date(fecha).toISOString() : null,
    hora: document.getElementById('wHora').value.trim(),
    duracion: document.getElementById('wDuracion').value.trim(),
    link: document.getElementById('wLink').value.trim(),
    grabacion: document.getElementById('wGrabacion').value.trim()
  };
  if (!datos.titulo || !datos.fecha) { toast('Título y fecha obligatorios', 'error'); return; }
  if (id) {
    db.collection('sesiones').doc(id).update(datos).then(() => { cerrarModal(); toast('Sesión actualizada', 'success'); });
  } else {
    db.collection('sesiones').add(datos).then(() => { cerrarModal(); toast('Sesión programada', 'success'); });

};

  if (!confirm('¿Eliminar esta sesión?')) return;

};

PAGES.estadisticas = function() { renderStats(); };
function renderStats() {
  const cont = document.getElementById('content');
  const planes = {};
  STATE.miembros.forEach(m => { const p = m.plan || 'Free'; planes[p] = (planes[p]||0)+1; });
  const cats = {};
  STATE.cursos.forEach(c => { const k = c.categoria || 'GENERAL'; cats[k] = (cats[k]||0)+1; });
  const ingresos12m = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(); d.setMonth(d.getMonth()-i); d.setDate(1); d.setHours(0,0,0,0);
    const next = new Date(d); next.setMonth(next.getMonth()+1);
    const total = STATE.pagos.filter(p => { const f = p.fecha?new Date(p.fecha):null; return f && f >= d && f < next; }).reduce((a,p) => a + (p.monto||0), 0);
    ingresos12m.push({ label: d.toLocaleDateString('es-MX',{month:'short'}).slice(0,3), val: total });
  }
  const maxIng = Math.max(1, ...ingresos12m.map(d => d.val));
  cont.innerHTML = `
    <div class="page-header"><div><h1>📊 Estadísticas</h1><p>Métricas y análisis</p></div></div>
    <div class="block" style="margin-bottom:18px;">
      <div class="block-head"><h3>💰 Ingresos últimos 12 meses</h3></div>
      <div class="bar-chart" style="height:200px;">
        ${ingresos12m.map(d => `
          <div class="bar-col">
            <div class="bar" style="height:${(d.val/maxIng)*170}px" title="${fmtMoney(d.val)}"></div>
            <div class="bar-label">${d.label}</div>
          </div>
        `).join('')}
      </div>
      <div style="display:flex;justify-content:space-between;font-size:.78rem;color:var(--text-mute);padding-top:8px;border-top:1px solid var(--border);">
        <span>Total año: <strong style="color:var(--gold-light);">${fmtMoney(ingresos12m.reduce((a,b)=>a+b.val,0))}</strong></span>
        <span>Mejor mes: <strong style="color:var(--gold-light);">${fmtMoney(maxIng)}</strong></span>
      </div>
    </div>
    <div class="dash-grid">
      <div class="block">
        <div class="block-head"><h3>📋 Distribución por plan</h3></div>
        ${Object.keys(planes).length === 0 ? '<p style="color:var(--text-mute);">Sin datos</p>' : Object.entries(planes).map(([p,n]) => {
          const pct = (n / STATE.miembros.length * 100).toFixed(1);
          return `<div style="margin-bottom:10px;">
            <div style="display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:4px;"><span>${escapeHTML(p)}</span><span style="color:var(--gold-light);font-weight:700;">${n} (${pct}%)</span></div>
            <div style="height:8px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden;"><div style="height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));width:${pct}%;border-radius:4px;"></div></div>
          </div>`;
        }).join('')}
      </div>
      <div class="block">
        <div class="block-head"><h3>🎓 Cursos por categoría</h3></div>
        ${Object.keys(cats).length === 0 ? '<p style="color:var(--text-mute);">Sin cursos</p>' : Object.entries(cats).map(([c,n]) => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);">
            <span>${escapeHTML(c)}</span>
            <span style="color:var(--gold-light);font-weight:700;">${n}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

const CMDK_ACTIONS = [
  { icon: '🏠', text: 'Ir al Dashboard', action: () => navigateTo('dashboard') },
  { icon: '👥', text: 'Ver miembros', action: () => navigateTo('miembros') },
  { icon: '⏳', text: 'Pagos pendientes', action: () => navigateTo('pendientes') },

  { icon: '🎖️', text: 'Certificados', action: () => navigateTo('certificados') },
  { icon: '📊', text: 'Estadísticas', action: () => navigateTo('estadisticas') },
  { icon: '💰', text: 'Pagos', action: () => navigateTo('pagos') },
  { icon: '⚙️', text: 'Configuración', action: () => navigateTo('config') },
  { icon: '➕', text: 'Crear nuevo curso', action: () => { navigateTo('cursos'); setTimeout(abrirModalNuevoCurso, 300); } },
  { icon: '➕', text: 'Subir nuevo video', action: () => { navigateTo('videos'); setTimeout(abrirModalNuevoVideo, 300); } },
  { icon: '➕', text: 'Subir nuevo PDF', action: () => { navigateTo('pdfs'); setTimeout(abrirModalNuevoPdf, 300); } },
  { icon: '➕', text: 'Programar webinar', action: () => { navigateTo('webinars'); setTimeout(abrirModalNuevoWebinar, 300); } },
  { icon: '➕', text: 'Enviar nuevo aviso', action: () => { navigateTo('avisos'); setTimeout(abrirModalNuevoAviso, 300); } },
  { icon: '🎖️', text: 'Emitir certificado', action: () => { navigateTo('certificados'); setTimeout(abrirModalNuevoCert, 300); } },
  { icon: '🚀', text: 'Abrir el portal del socio', action: () => window.open('https://teccapitalweb.github.io/VisionPecuaria/', '_blank') },
  { icon: '🚪', text: 'Cerrar sesión', action: () => cerrarSesion() }
];
window.abrirCmdK = function() {
  document.getElementById('cmdkOverlay').classList.add('active');
  document.getElementById('cmdkInput').value = '';
  document.getElementById('cmdkInput').focus();
  pintarCmdK('');
};
window.cerrarCmdK = function() {
  document.getElementById('cmdkOverlay').classList.remove('active');
};
function pintarCmdK(query) {
  const q = (query||'').toLowerCase();
  // Combinar acciones + miembros + cursos
  const items = [
    ...CMDK_ACTIONS.map(a => ({ ...a, type: 'action' })),
    ...STATE.miembros.slice(0,20).map(m => ({ icon: '👤', text: `${m.nombre||m.email}`, sub: m.email, action: () => verMiembro(m.id), type: 'member' })),
    ...STATE.cursos.slice(0,10).map(c => ({ icon: c.emoji||'🎓', text: c.titulo, sub: c.categoria, action: () => { navigateTo('cursos'); setTimeout(() => editarCurso(c.id), 300); }, type: 'curso' }))
  ];
  const filtered = q ? items.filter(i => i.text.toLowerCase().includes(q) || (i.sub||'').toLowerCase().includes(q)) : items;
  document.getElementById('cmdkResults').innerHTML = filtered.length === 0
    ? '<div style="padding:30px;text-align:center;color:var(--text-mute);font-size:.85rem;">Sin resultados para "'+escapeHTML(q)+'"</div>'
    : filtered.slice(0, 30).map((i, idx) => `
        <div class="cmdk-item ${idx===0?'selected':''}" onclick="ejecutarCmdK(${idx})">
          <div class="cmdk-item-icon">${i.icon}</div>
          <div class="cmdk-item-text">${escapeHTML(i.text)}${i.sub ? `<div style="font-size:.72rem;color:var(--text-mute);">${escapeHTML(i.sub)}</div>` : ''}</div>
        </div>
      `).join('');
  window.__cmdk_filtered = filtered;
}
window.ejecutarCmdK = function(idx) {
  const item = (window.__cmdk_filtered || [])[idx];
  if (item && item.action) { cerrarCmdK(); item.action(); }
};
document.addEventListener('keydown', e => {
  if (document.getElementById('cmdkOverlay').classList.contains('active')) {
    if (e.key === 'Enter') {
      e.preventDefault();
      ejecutarCmdK(0);
    }
  }
});
document.getElementById('cmdkInput').addEventListener('input', e => pintarCmdK(e.target.value));
</script>
