<script>
  // ═══════════════════════════════════════════════════════════
  // El portal pasó a ser El Rancho Digital (rancho.html).
  // Esta página quedó solo como puente para los enlaces viejos.
  //
  // La ruta es RELATIVA a propósito: el sitio vive en el
  // subdirectorio /VisionPecuaria/ de GitHub Pages, y un
  // '/rancho.html' absoluto sacaría al socio fuera del sitio.
  //
  // Se arrastran search y hash: los enlaces de autologin que la
  // landing manda por correo y WhatsApp llegan como
  // index.html#g=... (también #a= y #f=). Sin el fragmento el
  // socio perdería la sesión y acabaría en el login a mano.
  // rancho.html sabe procesarlos igual (rancho-js/firebase.js).
  //
  // replace() y no href: así el puente no queda en el historial
  // y el botón "atrás" desde el rancho no rebota de vuelta aquí.
  // ═══════════════════════════════════════════════════════════
  (function () {
    window.location.replace('rancho.html' + window.location.search + window.location.hash);
  })();
</script>

<!-- Red de seguridad por si el script de arriba no corriera. Va DESPUÉS a
     propósito: el script se ejecuta durante el parseo y gana siempre; esto
     solo actúa si murió. A 2s y no a 0 para no competir con él y tirar el hash. -->
<meta http-equiv="refresh" content="2; url=rancho.html">
</head>

  <p style="margin:0"><a href="rancho.html" style="color:#e8c465;font-weight:700;font-size:16px;text-decoration:none">Entrar a El Rancho Digital →</a></p>
</body>
